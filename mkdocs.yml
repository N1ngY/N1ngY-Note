      - Web: ctf/web/index.md
      - Pwn: ctf/pwn/index.md
      - Reverse: ctf/reverse/index.md
      - Crypto: ctf/crypto/index.md
      - Misc: ctf/misc/index.md
      - AI: ctf/ai/index.md
